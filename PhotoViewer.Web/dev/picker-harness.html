<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Picker / Demo panel harness</title>
    <link rel="stylesheet" href="../src/shell/app.css">
    <link rel="stylesheet" href="../src/shell/picker.css">
    <link rel="stylesheet" href="../src/demo/panel.css">
    <style>
        .pv-harness-bar {
            position: absolute;
            left: 12px;
            bottom: 12px;
            z-index: 20;
            display: flex;
            gap: 8px;
        }

        .pv-harness-bar button {
            height: 28px;
            padding: 0 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            background: rgba(40, 40, 44, 0.9);
            color: #eee;
            font: inherit;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <main id="app"></main>
    <script type="module">
        import { createTokens } from "../src/core/tokens.js";
        import baseTokens from "../src/tokens.g.js";
        import { systemClock } from "../src/core/clock.js";
        import { createLibrary } from "../src/core/library.js";
        import { createApp } from "../src/core/app.js";
        import { createDecoder } from "../src/render/decoder.js";
        import { createStore } from "../src/render/store.js";
        import { el, applyTokenVariables } from "../src/shell/dom.js";
        import { mountPicker } from "../src/shell/picker.js";
        import { mountDemoPanel } from "../src/demo/panel.js";

        const params = new URLSearchParams(location.search);
        const t = createTokens(params.get("platform") ?? "web");
        const clock = systemClock();
        const library = createLibrary();
        const decoder = createDecoder({ clock });
        const store = createStore({ clock });
        const reducedMotionQuery = matchMedia("(prefers-reduced-motion: reduce)");
        let reducedMotionOverride = null;
        const reducedMotion = () => reducedMotionOverride ?? reducedMotionQuery.matches;

        const body = document.getElementById("app");
        body.dataset.platform = t.profile;
        body.classList.toggle("is-demo", params.has("demo"));

        const stage = el("div", { class: "pv-stage" });
        const windowEl = el("div", { class: "pv-window", role: "application", "aria-label": "PhotoViewer" });
        stage.append(windowEl);
        body.append(stage);
        applyTokenVariables(document.documentElement, t, Object.keys(baseTokens));

        const app = createApp({
            t,
            clock,
            profile: t.profile,
            library,
            decoder,
            store,
            dpr: devicePixelRatio,
            reducedMotion,
        });

        const sizeOverride = { width: null, height: null };
        function syncWindowSize() {
            const width = sizeOverride.width ?? stage.clientWidth;
            const height = sizeOverride.height ?? stage.clientHeight;
            windowEl.style.width = `${width}px`;
            windowEl.style.height = `${height}px`;
            app.setWindowSize(width, height);
        }

        const shell = {
            app,
            t,
            library,
            store,
            decoder,
            render() {},
            setWindowSize(width, height) {
                sizeOverride.width = width;
                sizeOverride.height = height;
                syncWindowSize();
            },
            setReducedMotion(value) {
                reducedMotionOverride = value;
            },
        };
        globalThis.pv = shell;

        const picker = mountPicker(windowEl, { app }, library);
        app.on("request-open", ({ kind }) => picker.show(kind));

        const toolbar = el("div", { class: "pv-harness-bar" },
            el("button", { type: "button", onclick: () => picker.show("file") }, "打开文件…"),
            el("button", { type: "button", onclick: () => picker.show("folder") }, "打开文件夹…"));
        stage.append(toolbar);

        new ResizeObserver(syncWindowSize).observe(stage);
        if (params.has("demo")) mountDemoPanel(body, shell);

        syncWindowSize();
        if (!params.has("empty")) app.openFolder("harbor");
    </script>
</body>
</html>
